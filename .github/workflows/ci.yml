name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend (ruff, mypy, pytest + coverage)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reactor
          POSTGRES_PASSWORD: reactor
          POSTGRES_DB: reactor_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reactor -d reactor_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: backend
    outputs:
      coverage: ${{ steps.coverage.outputs.percent }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - name: Ruff (lint)
        run: ruff check --output-format=github .
      - name: Ruff (format)
        run: ruff format --check .
      - name: Mypy (strict)
        run: mypy
      - name: Pytest on PostgreSQL, with coverage
        env:
          # The suite builds the schema with the real Alembic migrations, against Postgres.
          TEST_DATABASE_URL: postgresql+psycopg://reactor:reactor@localhost:5432/reactor_test
        run: pytest --cov --cov-report=term --cov-report=xml --cov-report=json
      - name: Coverage summary
        id: coverage
        run: |
          percent=$(python -c "import json; print(round(json.load(open('coverage.json'))['totals']['percent_covered']))")
          echo "percent=$percent" >> "$GITHUB_OUTPUT"
          echo "### Backend coverage: ${percent}% (branch coverage)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml

  frontend:
    name: Frontend (eslint, tsc, vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: ESLint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests (Vitest)
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: reactor
          POSTGRES_PASSWORD: reactor
          POSTGRES_DB: reactor
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U reactor -d reactor"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://reactor:reactor@localhost:5432/reactor
      E2E_USERNAME: e2e-operator
      # A throwaway account in a throwaway database that only exists for this job.
      E2E_PASSWORD: e2e-operator-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start the backend
        working-directory: backend
        run: |
          pip install -e .
          alembic upgrade head
          echo "$E2E_PASSWORD" | python -m app.cli create-user --username "$E2E_USERNAME" --role operator --password-stdin
          nohup uvicorn app.main:app --port 8000 > ../backend.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && exit 0; sleep 1; done
          cat ../backend.log; exit 1
      - name: Install frontend and Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Playwright
        working-directory: frontend
        run: npx playwright test
      - name: Upload report and backend log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
            backend.log

  quickstart:
    name: Quick start (fresh clone, docker compose up)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up (no .env, no setup, exactly as in the README)
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: The app loads and every demo user can sign in through the frontend
        run: |
          curl -fs localhost:5173/ | grep -q '<div id="root">'
          curl -fs localhost:5173/api/health
          for role in viewer operator supervisor; do
            token=$(curl -fs -X POST localhost:5173/api/auth/login \
              -d "username=$role&password=$role-demo" | python3 -c "import json,sys; print(json.load(sys.stdin)['access_token'])")
            me=$(curl -fs localhost:5173/api/auth/me -H "Authorization: Bearer $token")
            echo "$me"
            echo "$me" | grep -q "\"role\":\"$role\""
          done
          # Live telemetry is flowing: a persisted reading appears within a few seconds.
          sleep 3
          curl -fs "localhost:5173/api/history?minutes=1" -H "Authorization: Bearer $token" \
            | python3 -c "import json,sys; n=json.load(sys.stdin)['count']; print(n, 'readings'); assert n > 0"
      - name: Container logs
        if: always()
        run: docker compose logs --no-color | tail -n 100

  coverage-badge:
    name: Publish coverage badge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [backend, frontend, e2e, quickstart]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Write badge JSON to the badges branch
        env:
          PERCENT: ${{ needs.backend.outputs.coverage }}
        run: |
          color=red
          [ "$PERCENT" -ge 70 ] && color=yellow
          [ "$PERCENT" -ge 85 ] && color=green
          [ "$PERCENT" -ge 95 ] && color=brightgreen
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin badges 2>/dev/null; then git checkout badges; else git checkout --orphan badges && git rm -rfq .; fi
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PERCENT" "$color" > coverage.json
          git add coverage.json
          git diff --cached --quiet || { git commit -qm "Coverage ${PERCENT}%"; git push origin badges; }
